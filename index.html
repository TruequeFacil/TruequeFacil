<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2042%2042%22%3E%3Cdefs%3E%3ClinearGradient%20id=%22g%22%20x1=%220%22%20y1=%220%22%20x2=%221%22%20y2=%221%22%3E%3Cstop%20offset=%220%22%20stop-color=%22%2314b8a6%22/%3E%3Cstop%20offset=%221%22%20stop-color=%22%230a6b5e%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width=%2242%22%20height=%2242%22%20rx=%2213%22%20fill=%22url%28%23g%29%22/%3E%3Ccircle%20cx=%2233%22%20cy=%229%22%20r=%224.5%22%20fill=%22%23ff8a3d%22/%3E%3Cg%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-width=%223%22%20stroke-linecap=%22round%22%20stroke-linejoin=%22round%22%3E%3Cpath%20d=%22M10%2016h20M24%2010l6%206-6%206%22/%3E%3Cpath%20d=%22M32%2027H12M18%2021l-6%206%206%206%22/%3E%3C/g%3E%3C/svg%3E">

<title>TruequeFacil · Intercambia lo que no usas</title>
<style>
:root{--ink:#222;--txt:#333;--mid:#777;--line:#bbb;--soft:#eee;--pale:#f5f5f5;--img:#d9d9d9}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--txt);background:#fff;font-size:15px}
a{color:inherit;text-decoration:none;cursor:pointer}
h1,h2,h3{color:var(--ink);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
/* nav */
header{border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.nav{display:flex;align-items:center;gap:14px;padding:12px 20px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.logo{font-size:28px;font-weight:700;color:var(--ink);margin-right:8px}
.search{display:flex;flex:1;min-width:200px;max-width:460px}
.search input{flex:1;border:1px solid #888;border-right:0;padding:10px 12px;font-size:14px;border-radius:6px 0 0 6px}
.search button{border-radius:0 6px 6px 0}
.spacer{flex:1}
.navlink{font-weight:700;color:var(--ink);position:relative}
.badge{background:var(--ink);color:#fff;border-radius:50%;font-size:11px;padding:2px 6px;margin-left:4px}
/* botones */
.btn{display:inline-block;border:1px solid #555;background:#fff;color:var(--ink);padding:9px 16px;border-radius:8px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-align:center}
.btn:hover{background:var(--soft)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.dark:hover{background:#000}
.btn.block{display:block;width:100%}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.chip{border:1px solid #888;border-radius:999px;padding:7px 16px;font-size:13px;background:#fff;cursor:pointer;color:var(--txt)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.tag{display:inline-block;border:1px solid #888;border-radius:999px;padding:4px 12px;font-size:12px;margin:0 6px 6px 0}
/* hero */
.hero{background:var(--soft);border:1px solid #ccc;padding:28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-top:20px;border-radius:6px}
.hero h1{font-size:30px;margin-bottom:8px}
.hero .grow{flex:1;min-width:260px}
.aviso{border:1px dashed #888;background:#fff;padding:12px 16px;font-size:13px;font-style:italic;max-width:360px}
/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:4px;padding:8px;background:#fff;display:block;transition:box-shadow .15s}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.18)}
.card img,.ph{width:100%;height:150px;object-fit:cover;display:block;border:1px solid #aaa}
.ph{background:linear-gradient(to top right,transparent calc(50% - 1px),#aaa,transparent calc(50% + 1px)),linear-gradient(to bottom right,transparent calc(50% - 1px),#aaa,transparent calc(50% + 1px)),var(--img);position:relative}
.ph span{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--img);color:var(--mid);font-size:11px;font-weight:700;padding:3px 8px}
.card h3{font-size:15px;margin:10px 2px 2px}
.card .meta{font-size:12px;color:var(--mid);margin:0 2px 8px}
.card .busca{background:var(--soft);border-radius:999px;padding:5px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sold{position:absolute;top:8px;left:8px;background:var(--ink);color:#fff;font-size:11px;padding:3px 8px}
.row{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;gap:10px;flex-wrap:wrap}
.row h2{font-size:21px}
/* explorar */
.layout{display:grid;grid-template-columns:240px 1fr;gap:24px;margin-top:22px}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.panel{border:1px solid var(--line);padding:16px;border-radius:4px;align-self:start}
.panel h4{margin:14px 0 8px;color:var(--ink);font-size:14px}
.panel h4:first-of-type{margin-top:6px}
.panel label{display:block;font-size:14px;margin:6px 0;cursor:pointer}
.panel input[type=checkbox],.panel input[type=radio]{margin-right:8px;accent-color:#222}
/* formularios */
input,select,textarea{font-family:inherit;font-size:14px;border:1px solid #999;border-radius:4px;padding:10px;width:100%;background:#fff;color:var(--txt)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-weight:700;color:var(--ink);font-size:13px;margin:14px 0 5px}
.formcard{border:1px solid #999;padding:28px;max-width:460px;margin:34px auto;border-radius:4px}
.formcard.wide{max-width:760px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.two{grid-template-columns:1fr}}
.err{color:#000;background:var(--soft);border:1px solid #888;padding:8px 12px;margin-top:12px;font-size:13px;display:none}
.center{text-align:center}
.muted{color:var(--mid);font-size:13px}
/* detalle */
.detail{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px}
@media(max-width:800px){.detail{grid-template-columns:1fr}}
.main-img{width:100%;height:380px;object-fit:cover;border:1px solid #aaa}
.main-img.ph{height:380px}
.thumbs{display:flex;gap:10px;margin-top:10px}
.thumbs img,.thumbs .ph{width:80px;height:64px;cursor:pointer;border:1px solid #aaa;object-fit:cover}
.box{background:var(--pale);border:1px solid #ccc;padding:12px;margin:6px 0 16px;border-radius:4px;white-space:pre-wrap}
.want{background:var(--soft);border:1px solid #888;font-weight:700;color:var(--ink)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--img);border:1px solid #999;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#555;vertical-align:middle}
.avatar.big{width:96px;height:96px;font-size:36px}
/* subir */
.upl{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.slot{width:100px;height:100px;border:1px dashed #888;background:var(--pale);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--mid);font-weight:700;position:relative;cursor:pointer}
.slot img{width:100%;height:100%;object-fit:cover}
.slot .x{position:absolute;top:2px;right:2px;background:var(--ink);color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:12px;text-align:center}
/* perfil / propuestas */
.profile{display:grid;grid-template-columns:260px 1fr;gap:24px;margin-top:22px}
@media(max-width:800px){.profile{grid-template-columns:1fr}}
.stats{display:flex;justify-content:space-around;margin:16px 0}
.stats b{display:block;font-size:22px;color:var(--ink)}
.stats span{font-size:12px;color:var(--mid)}
.tabs{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.offer{border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:14px;display:grid;grid-template-columns:1fr 40px 1fr 190px;gap:12px;align-items:center}
@media(max-width:900px){.offer{grid-template-columns:1fr}}
.offer .it{display:flex;gap:10px;align-items:center}
.offer .it img,.offer .it .ph{width:70px;height:70px;flex:none}
.offer .arrow{font-size:24px;text-align:center;color:var(--mid)}
.status{display:inline-block;border:1px solid #777;border-radius:999px;padding:3px 12px;font-size:12px;margin:4px 0}
.contact{background:var(--soft);border:1px dashed #666;padding:8px;font-size:12px;margin-top:6px}
.empty{border:1px dashed #999;padding:40px;text-align:center;color:var(--mid);background:var(--pale);border-radius:4px}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(30,30,30,.55);z-index:50;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.modal{background:#fff;border:1px solid #777;max-width:480px;width:100%;padding:28px;position:relative;max-height:90vh;overflow:auto;border-radius:4px}
.modal .close{position:absolute;right:14px;top:10px;font-size:20px;cursor:pointer;font-weight:700}
.pick{display:flex;gap:10px;align-items:center;border:1px solid var(--line);padding:8px;margin:8px 0;cursor:pointer;border-radius:4px}
.pick:has(input:checked){border-color:var(--ink);background:var(--soft)}
.pick input{width:auto;margin:0}
.pick img,.pick .ph{width:56px;height:56px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60}
#toast.show{opacity:1}
footer{border-top:1px solid var(--line);margin-top:50px;padding:20px;text-align:center;font-size:12px;color:var(--mid)}

/* ===== Tema de color TruequeFacil ===== */
:root{--ink:#1c2b36;--txt:#34454f;--mid:#6b7c86;--brand:#0e9384;--brand2:#0a6b5e;--accent:#ff8a3d;--tint:#e3f5f2;--soft:#edf6f5;--pale:#f4faf9;--line:#cfe0dd;--img:#d4e9e6}
body{background:#fbfefd}
header{border-bottom:0;box-shadow:0 2px 14px rgba(14,147,132,.14)}
.logo{display:flex;align-items:center;gap:9px;font-size:25px;font-weight:800;letter-spacing:-.6px;margin-right:10px}
.logo b{color:var(--accent);font-weight:800}
.logo svg{filter:drop-shadow(0 3px 5px rgba(14,147,132,.35));transition:transform .3s}
.logo:hover svg{transform:rotate(180deg)}
.navlink:hover{color:var(--brand)}
.badge{background:var(--accent)}
.btn{border-color:var(--brand);color:var(--brand2);border-radius:999px}
.btn:hover{background:var(--tint)}
.btn.dark{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(14,147,132,.3)}
.btn.dark:hover{background:linear-gradient(135deg,#12a897,#0a6b5e);filter:none;transform:translateY(-1px)}
.search input{border-color:var(--brand);border-radius:999px 0 0 999px;padding-left:16px}
.search button{border-radius:0 999px 999px 0}
.chip{border-color:var(--brand);color:var(--brand2)}
.chip:hover{background:var(--tint)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.hero{background:linear-gradient(120deg,#d4f1ec 0%,#fff0e1 100%);border:0;border-radius:22px;padding:34px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,138,61,.18)}
.hero::before{content:"";position:absolute;left:38%;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(14,147,132,.13)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:34px}
.hero h1 em{font-style:normal;color:var(--brand)}
.aviso{border-color:var(--accent);background:#fff;border-radius:12px}
.card{border-radius:16px;border-color:var(--line);padding:10px;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 10px 24px rgba(14,147,132,.22);transform:translateY(-3px)}
.card img,.ph{border-radius:12px;border-color:var(--line)}
.card .busca{background:#fff0e1;color:#9a4a10;font-weight:700}
.sold{background:var(--accent)}
.tag{border-color:var(--brand);color:var(--brand2);background:var(--tint)}
.box{border-radius:12px;border-color:var(--line)}
.want{background:#fff0e1;border-color:var(--accent);color:#7a3a0a}
.avatar{background:var(--tint);border-color:var(--brand);color:var(--brand2)}
.panel,.formcard,.offer{border-radius:16px;border-color:var(--line)}
.formcard{box-shadow:0 10px 30px rgba(14,147,132,.13)}
input,select,textarea{border-color:#a9c7c2;border-radius:10px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.panel input[type=checkbox],.panel input[type=radio]{accent-color:var(--brand)}
.empty{background:var(--pale);border-color:var(--brand);border-radius:16px}
.slot{border-color:var(--brand);background:var(--tint);color:var(--brand2);border-radius:12px}
.slot img{border-radius:12px}.slot .x{background:var(--brand)}
.pick{border-radius:12px}.pick:has(input:checked){border-color:var(--brand);background:var(--tint)}
.modal{border:0;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.status{border-color:var(--brand);color:var(--brand2);background:var(--tint)}
.contact{background:#fff0e1;border-color:var(--accent)}
.row h2,.panel h3{position:relative}
#toast{background:var(--brand2)}
footer{background:#0b4f47;color:#cfeee9;border:0;padding:26px 20px}

/* ===== Chat, entrega y pago ===== */
.chatbox{border:1px solid var(--line);border-radius:18px;margin:22px auto;max-width:820px;background:#fff;box-shadow:0 10px 30px rgba(14,147,132,.1);overflow:hidden}
#chathead{padding:16px 18px;background:linear-gradient(120deg,#e3f5f2,#fff5ea);border-bottom:1px solid var(--line)}
.chattop{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.swap{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.swap .it{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.swap .it img,.swap .it .ph{width:46px;height:46px;border-radius:8px}
.swap .arrow{font-size:22px;color:var(--brand)}
.swap .ph span,.offer .ph span,.pick .ph span{display:none}
.pills{margin-top:10px}.pills .status{margin-right:6px}
.acts{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.waitbox,.okbox{padding:9px 14px;border-radius:12px;font-size:13px}
.waitbox{background:#fff;border:1px dashed var(--brand);color:var(--brand2)}
.okbox{background:var(--brand);color:#fff}
.msgs{height:360px;overflow-y:auto;padding:16px;background:#f7fbfa;display:flex;flex-direction:column;gap:8px}
.bub{max-width:76%;padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.35;word-break:break-word}
.bub span{display:block;font-size:10px;opacity:.65;margin-top:3px;text-align:right}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-bottom-right-radius:4px}
.bub.th{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.sysmsg{align-self:center;background:#fff0e1;color:#8a4210;border-radius:999px;font-size:12px;padding:5px 14px;text-align:center}
.chatform{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}
.chatform input{border-radius:999px;padding:11px 16px}
.steps{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.st{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mid);background:#fff}
.st b{width:26px;height:26px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;color:var(--mid)}
.st.cur{border-color:var(--brand);color:var(--ink);font-weight:700}.st.cur b{background:var(--brand);color:#fff}
.st.done{color:var(--brand2)}.st.done b{background:var(--brand2);color:#fff}
.qrwrap{display:grid;grid-template-columns:300px 1fr;gap:28px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:26px;background:#fff;box-shadow:0 10px 30px rgba(14,147,132,.1)}
@media(max-width:760px){.qrwrap{grid-template-columns:1fr;text-align:center}}
.qrbox{padding:12px;border:3px solid var(--brand);border-radius:20px;background:#fff;max-width:300px}
.qrbox svg{display:block;width:100%;height:auto}
.price{font-size:30px;font-weight:800;color:var(--ink);margin:6px 0}
.pulse{display:inline-flex;align-items:center;gap:8px;background:#fff0e1;color:#8a4210;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;margin:10px 0}
.pulse i{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pl 1.2s infinite}
@keyframes pl{0%{transform:scale(.6);opacity:.5}50%{transform:scale(1.2);opacity:1}100%{transform:scale(.6);opacity:.5}}
.bigcheck{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#14b8a6,#0a6b5e);color:#fff;font-size:46px;display:flex;align-items:center;justify-content:center;margin:6px auto 14px;box-shadow:0 8px 20px rgba(14,147,132,.4);animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.sum{background:var(--pale);border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:left;font-size:14px;margin:10px 0}
.sum div{margin:3px 0}

/* ===== Páginas informativas ===== */
footer a{color:#cfeee9;text-decoration:underline}footer a:hover{color:#fff}
.legal{max-width:860px;margin:26px auto}
.legal h1{font-size:30px;margin:14px 0 4px}
.legal h2{font-size:18px;margin:26px 0 8px;color:var(--brand2)}
.legal p,.legal li{line-height:1.6;font-size:14.5px;margin:8px 0}
.legal ul{padding-left:22px;margin:8px 0}
.legal .box2{background:#fff0e1;border:1px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:13.5px;margin:16px 0}
.howgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;margin:22px 0}
.how{border:1px solid var(--line);border-radius:18px;padding:22px;background:#fff;box-shadow:0 6px 18px rgba(14,147,132,.08)}
.how b.n{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:10px}
.how h3{font-size:18px;margin-bottom:6px}.how p{margin:0;font-size:14px;line-height:1.5}
.faq details{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:#fff;padding:0 18px}
.faq summary{cursor:pointer;font-weight:700;color:var(--ink);padding:15px 0;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--brand);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{margin:0 0 16px;line-height:1.6;font-size:14.5px}
.faq details[open]{border-color:var(--brand);box-shadow:0 4px 14px rgba(14,147,132,.1)}
</style>

const FEE = 12000;

function qrSvg(text) {

  return ok ? `<div class="formcard center"><div class="bigcheck">✓</div><h1 style="font-size:26px">¡Pago exitoso!</h1><p>Se registró el pago del domicilio por <b>${money(FEE)}</b>.</p>

    : `<div class="formcard center"><h1 style="font-size:24px">Código no válido</h1><p class="muted">Este QR no corresponde a un pago pendiente.</p><a class="btn" href="#/">Ir al inicio</a></div>`;
}

/* ---------- Router ---------- */
let timer = null;
const stopPoll = () => { clearInterval(timer); timer = null; };
const startPoll = (fn, ms = 2500) => { stopPoll(); timer = setInterval(() => fn().catch(() => {}), ms); };

async function route() {
  stopPoll(); await load(); navbar();
  const [path, query] = (location.hash.slice(1) || '/').split('?');
  const p = path.split('/').filter(Boolean);
  const guard = () => { if (!me) { location.hash = '#/login'; toast('Inicia sesión para continuar'); return false; } return true; };
  let html = '';
  switch (p[0]) {
    case undefined: html = V.home(); break;
    case 'explorar': if (query) { const q = new URLSearchParams(query); if (q.has('q')) flt.q = q.get('q'); } html = V.explore(); break;
    case 'item': html = V.item(p[1]); break;
    case 'login': html = me ? (location.hash = '#/perfil', '') : V.login(); break;
    case 'registro': html = me ? (location.hash = '#/perfil', '') : V.register(); break;
    case 'subir': if (!guard()) return; pending = []; html = V.upload(); break;
    case 'perfil': if (!p[1] && !guard()) return; html = V.profile(p[1]); break;
    case 'propuestas': if (!guard()) return; html = V.offers(); break;
    case 'chat': if (!guard()) return; html = V.chat(p[1]); break;
    case 'entrega': if (!guard()) return; html = V.delivery(p[1]); break;
    case 'pagar': html = await payRoute(p[1], p[2]); break;
    case 'terminos': html = V.terms(); break;
    case 'privacidad': html = V.privacy(); break;
    case 'como-funciona': html = V.how(); break;
    case 'ayuda': html = V.help(); break;
    default: html = '<div class="empty" style="margin-top:30px">Página no encontrada.</div>';
  }
  $('#app').innerHTML = html; window.scrollTo(0, 0);
  if (p[0] === 'subir') drawSlots();
  if (p[0] === 'chat' && $('#msgs')) { await refreshChat(p[1], true); startPoll(() => refreshChat(p[1])); }
  if (p[0] === 'entrega') { const o = D.offers.find(x => x.id === p[1]); if (o && o.status === 'aceptada' && !o.paid) startPoll(() => pollDelivery(p[1]), 2000); }
}
function drawSlots() {
  const s = $('#slots'); if (!s) return;
  s.innerHTML = pending.map((x, i) => `<div class="slot"><img src="${x}"><span class="x" data-a="rmimg" data-i="${i}">✕</span></div>`).join('') +
    (pending.length < 4 ? `<div class="slot" data-a="addimg">+<br>${pending.length ? 'Añadir' : 'Foto principal'}</div>` : '');
}
const rerender = () => route();

/* ---------- Eventos ---------- */
document.addEventListener('click', async e => {
  const cat = e.target.closest('[data-cat]'); if (cat) { flt = { q: '', cats: cat.dataset.cat ? [cat.dataset.cat] : [], conds: [], city: '', sort: 'new' }; }
  const t = e.target.closest('[data-a]'); if (!t) return;
  const a = t.dataset.a, id = t.dataset.id;
  if (a === 'close') { closeModal(); return; }
  if (a === 'gate') { gate(); return; }
  if (a === 'clear') { flt = { q: '', cats: [], conds: [], city: '', sort: 'new' }; rerender(); return; }
  if (a === 'tab') { V.offers.tab = t.dataset.t; rerender(); return; }
  if (a === 'zoom') { const m = $('.main-img'); if (m) m.src = t.src; return; }
  if (a === 'logout') { localStorage.removeItem('tradeo_session'); V.offers.tab = 'rec'; location.hash = '#/'; toast('Sesión cerrada'); rerender(); return; }
  if (a === 'addimg') { $('#file').click(); return; }
  if (a === 'rmimg') { pending.splice(+t.dataset.i, 1); drawSlots(); return; }
  if (a === 'delitem') { if (confirm('¿Eliminar esta publicación?')) { await Store.del('items', id); toast('Publicación eliminada'); location.hash = '#/perfil'; rerender(); } return; }
  if (a === 'offer') { if (!me) { gate(); return; } openOffer(id); return; }
  if (a === 'sendoffer') { await sendOffer(id); return; }
  if (a === 'cancel') { await Store.set('offers', id, { status: 'cancelada' }); toast('Propuesta cancelada'); rerender(); return; }
  if (a === 'reject') { await Store.set('offers', id, { status: 'rechazada' }); toast('Propuesta rechazada'); rerender(); return; }
  if (a === 'accepttrade') { await acceptTrade(id); return; }
  if (a === 'canceltrade') { if (confirm('¿Cancelar este trueque?')) { await Store.set('offers', id, { status: 'cancelada' }); await sys(id, `@${me.username} canceló el trueque.`); await refreshChat(id, true); } return; }
});

  const t = e.target;
  if (t.id === 'file') {
    for (const f of [...t.files]) {
      if (pending.length >= 4) { toast('Máximo 4 imágenes por artículo'); break; }
      if (!f.type.startsWith('image/')) { toast(`“${f.name}” no es una imagen`); continue; }
      if (f.size > 10 * 1024 * 1024) { toast(`“${f.name}” pesa ${(f.size / 1048576).toFixed(1)} MB y supera el límite de 10 MB`); continue; }
      try { pending.push(await compress(f)); } catch { toast('No se pudo leer una imagen'); }
    }
    t.value = ''; drawSlots(); return;
  }
  const k = t.dataset.f; if (!k) return;
  if (k === 'cats' || k === 'conds') { flt[k] = t.checked ? [...flt[k], t.value] : flt[k].filter(x => x !== t.value); }
  else flt[k] = t.value;
  rerender();
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target, k = f.dataset.form; if (!k) return;
  const v = Object.fromEntries(new FormData(f)); const err = m => { const x = $('#err'); if (x) { x.textContent = m; x.style.display = 'block'; } };
  if (k === 'msg') { const txt = (v.text || '').trim(); if (!txt) return; f.reset(); await Store.add('messages', { offerId: f.dataset.id, userId: me.id, text: txt, createdAt: Date.now() }); await refreshChat(f.dataset.id, true); return; }
  if (k === 'delivery') {
    const o = D.offers.find(x => x.id === f.dataset.id); if (!o) return;
    const data = { name: v.name.trim(), address: v.address.trim(), city: v.city.trim(), docType: v.docType, doc: v.doc.trim(), phone: v.phone.trim(), at: Date.now() };
    await Store.set('offers', o.id, { [o.fromUser === me.id ? 'delivFrom' : 'delivTo']: data }); toast('Datos guardados'); rerender(); return;
  }
  if (k === 'search') { flt = { q: v.q, cats: [], conds: [], city: '', sort: 'new' }; location.hash = '#/explorar'; rerender(); return; }
  if (k === 'register') {
    await load();
    if (v.password !== v.password2) return err('Las contraseñas no coinciden.');
    if (D.users.some(u => u.email.toLowerCase() === v.email.trim().toLowerCase())) return err('Ya existe una cuenta con ese correo.');
    if (D.users.some(u => u.username.toLowerCase() === v.username.trim().toLowerCase())) return err('Ese nombre de usuario ya está en uso.');
    const u = await Store.add('users', { name: v.name.trim(), username: v.username.trim(), email: v.email.trim().toLowerCase(), city: v.city.trim(), pass: await sha(v.email.trim().toLowerCase() + ':' + v.password), createdAt: Date.now() });
    localStorage.setItem('tradeo_session', u.id); toast('¡Cuenta creada! Bienvenido a TruequeFacil'); location.hash = '#/perfil'; rerender();
  }
  if (k === 'login') {
    await load(); const em = v.email.trim().toLowerCase(); const h = await sha(em + ':' + v.password);
    const u = D.users.find(x => x.email === em && x.pass === h);
    if (!u) return err('Correo o contraseña incorrectos.');
    localStorage.setItem('tradeo_session', u.id); V.offers.tab = 'rec'; toast('Sesión iniciada'); location.hash = '#/perfil'; rerender();
  }
  if (k === 'upload') {
    if (!me) return;
    try { await Store.add('items', { userId: me.id, title: v.title.trim(), category: v.category, condition: v.condition, description: v.description.trim(), city: v.city.trim(), images: pending, wantTitle: v.wantTitle.trim(), wantCategory: v.wantCategory, wantNotes: v.wantNotes.trim(), status: 'disponible', createdAt: Date.now() }); }
    catch (er) { console.error(er); return err('No se pudo guardar: el almacenamiento está lleno o las fotos son demasiado pesadas. Prueba con menos fotos.'); }
    pending = []; toast('¡Artículo publicado!'); location.hash = '#/perfil'; rerender();
  }
});
function openOffer(targetId) {
  const t = item(targetId); const mine = D.items.filter(i => i.userId === me.id && i.status !== 'intercambiado');
  if (!mine.length) { openModal(`<div class="center"><h2 style="font-size:20px">Primero sube un artículo</h2><p class="muted">Para proponer un intercambio necesitas tener al menos un artículo disponible.</p><a class="btn dark" href="#/subir" data-a="close">Subir artículo</a></div>`); return; }
  openModal(`<h2 style="font-size:20px">Proponer intercambio</h2><p class="muted">Por: <b>${esc(t.title)}</b>. Elige cuál de tus artículos ofreces:</p>
  ${mine.map((i, n) => `<label class="pick"><input type="radio" name="mine" value="${i.id}" ${n === 0 ? 'checked' : ''}>${img(i)}<span><b style="color:#222">${esc(i.title)}</b><br><span class="muted">${esc(i.category)} · ${esc(i.condition)}</span></span></label>`).join('')}
  <label class="f">Mensaje (opcional)</label><input id="msg" maxlength="140" placeholder="Ej. ¡Me interesa mucho, está en buen estado!">
  <br><a class="btn dark block" data-a="sendoffer" data-id="${targetId}">Enviar propuesta</a>`);
}
async function sendOffer(targetId) {
  const sel = document.querySelector('input[name=mine]:checked'); if (!sel) return;
  const t = item(targetId);
  if (D.offers.some(o => o.status === 'pendiente' && o.fromUser === me.id && o.offeredItem === sel.value && o.targetItem === targetId)) { toast('Ya enviaste esa propuesta'); return; }
  const msg = $('#msg').value.trim();
  const n = await Store.add('offers', { fromUser: me.id, toUser: t.userId, offeredItem: sel.value, targetItem: targetId, message: msg, status: 'pendiente', accFrom: false, accTo: false, createdAt: Date.now() });
  await sys(n.id, `@${me.username} propuso un trueque: «${item(sel.value)?.title}» por «${t.title}».`);
  if (msg) await Store.add('messages', { offerId: n.id, userId: me.id, text: msg, createdAt: Date.now() });
  closeModal(); toast('Propuesta enviada. ¡Conversa en el chat!'); location.hash = '#/chat/' + n.id;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
window.addEventListener('hashchange', route);
route();
</script>
